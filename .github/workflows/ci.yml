name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: UI tests (headless Chrome, modern interface)
        run: npm run test:ui -- --test-concurrency=1
        timeout-minutes: 15
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: UI tests (classic Xilinx ISE interface)
        run: npm run test:ui -- --test-concurrency=1
        timeout-minutes: 15
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SILINX_UI_INTERFACE: classic
      - name: Memory in WebKit (Safari's engine)
        run: npx playwright install --with-deps webkit && npm run test:webkit
        timeout-minutes: 15
      - run: node scripts/build-standalone.mjs
